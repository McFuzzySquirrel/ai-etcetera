[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dirk"
version = "0.1.0"
description = "Dirk — a holistic research agent that surfaces the fundamental interconnectedness of all repositories."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "McFuzzySquirrel" }]
keywords = ["agent", "knowledge-graph", "holistic", "discovery", "dirk-gently"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "PyYAML>=6.0",
    "click>=8.1",
]

[project.optional-dependencies]
github = ["requests>=2.31"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.scripts]
dirk = "dirk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dirk = ["templates/*.html", "templates/*.md", "schema/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
