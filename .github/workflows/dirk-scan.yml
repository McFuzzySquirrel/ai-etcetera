name: Dirk — Holistic Discovery scan

# Periodic + on-demand execution of the Dirk pipeline.
# On each run we refresh the knowledge graph, regenerate findings, and open
# a PR so a human can review what Dirk has noticed.

on:
  schedule:
    # Every Monday at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      depth:
        description: "Override scan depth (quick | standard | deep)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dirk-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dirk
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[github]"

      - name: Run Dirk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dirk run --all

      - name: Detect changes
        id: diff
        run: |
          if [ -n "$(git status --porcelain graph findings)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR with findings
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: dirk/scan-${{ github.run_id }}
          base: ${{ github.event.repository.default_branch }}
          commit-message: "Dirk scan: refresh knowledge graph + findings"
          title: "Dirk scan — $(date -u +%Y-%m-%d)"
          body: |
            Dirk has noticed some things.

            See `findings/latest.md` for the full report and
            `findings/delta-*.md` for what changed since the last run.

            Generated by `.github/workflows/dirk-scan.yml`.
          labels: |
            dirk
            holistic-discovery
          add-paths: |
            graph/**
            findings/**
